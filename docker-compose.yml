services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: luheng-portfolio-api
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./database.sqlite:/app/database.sqlite
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/database.sqlite
      - UPLOAD_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - website-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luheng-portfolio-web
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - website-network

networks:
  website-network:
    driver: bridge
